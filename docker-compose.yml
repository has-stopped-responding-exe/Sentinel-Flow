services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-local-only
      POSTGRES_DB: sentinelflow
    ports: ["5432:5432"]
    volumes: [sentinelflow_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
  backend:
    build: ./backend
    env_file: .env
    environment:
      USE_DEMO_MODEL: ${USE_DEMO_MODEL:-true}
      LOCAL_DB_PATH: /data/sentinelflow.db
    ports: ["8000:8000"]
    volumes: [sentinelflow_local:/data, ./models:/app/models:ro]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  sentinelflow_pg:
  sentinelflow_local:
